<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BlobToon Prototype Stage</title>
  <style>
    body { margin: 0; background: #0f172a; overflow: hidden; }
    svg { width: 1080px; height: 1920px; display: block; }
  </style>
</head>
<body>
  <svg id="stage" viewBox="0 0 1080 1920"></svg>
  <script>
    // Reference prototype pure-time SVG blob renderer (ported into Remotion components under src/characters/)
    window.renderFrameAtTime = function(tSec) {
      const svg = document.getElementById('stage');
      const bounce = Math.sin(tSec * Math.PI * 4) * 14;
      svg.innerHTML = `
        <rect width="1080" height="1920" fill="#1e293b" />
        <g transform="translate(540, ${1100 + bounce})">
          <path d="M -130 140 C -150 40, -120 -130, 0 -130 C 120 -130, 150 40, 130 140 C 90 165, -90 165, -130 140 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="12" />
          <circle cx="-42" cy="-20" r="16" fill="#0f172a" />
          <circle cx="42" cy="-20" r="16" fill="#0f172a" />
        </g>
      `;
    };
    window.renderFrameAtTime(0);
  </script>
</body>
</html>
